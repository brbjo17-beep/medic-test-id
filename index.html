<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Medic Test ID</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fa;
      color: #222;
    }

    header {
      text-align: center;
      padding: 60px 20px 40px;
      background: white;
    }

    header h1 {
      font-size: 42px;
      margin-bottom: 10px;
    }

    header p {
      color: #666;
      font-size: 18px;
    }

    main {
      max-width: 900px;
      margin: auto;
      padding: 30px 20px;
    }

    h2 {
      text-align: center;
      margin-bottom: 30px;
    }

    .subjects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
    }

    .subject {
      background: white;
      padding: 30px 20px;
      border-radius: 14px;
      text-align: center;
      font-size: 20px;
      font-weight: bold;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      cursor: pointer;
    }

    .subject:hover {
      transform: translateY(-3px);
    }
  </style>
</head>

<body>

<header>
  <h1>Medic Test ID</h1>
  <p>Latihan soal kedokteran Indonesia</p>
</header>

<main>

  <h2>Pilih Materi</h2>

  <div class="subjects">
    <div class="subject">Anatomi</div>
    <div class="subject">Fisiologi</div>
    <div class="subject">Histologi</div>
    <div class="subject">Biokimia</div>
    <div class="subject">Farmakologi</div>
    <div class="subject">Mikrobiologi</div>
    <div class="subject">Parasitologi</div>
  </div>

</main>

</body>
</html>
