let questions = [];
let currentBank = "";

function hideAll(){
document.getElementById("subjects").classList.add("hidden");
document.getElementById("banks").classList.add("hidden");
document.getElementById("quiz").classList.add("hidden");
document.getElementById("result").classList.add("hidden");
}

function home(){
hideAll();
document.getElementById("subjects").classList.remove("hidden");
}

function openSubject(subject){
currentSubject = subject;

hideAll();

document.getElementById("banks").classList.remove("hidden");
document.getElementById("subject-title").innerText =
"Bank Soal " + subject;
}

function backBanks(){
hideAll();
document.getElementById("banks").classList.remove("hidden");
}

function startQuiz(bankName){

currentBank = bankName;

questions = questionBanks[currentSubject][currentBank];

if (!questions || questions.length === 0) {
  alert("Bank soal ini masih kosong.");
  return;
}

currentQuestion = 0;
answers = [];
selected = null;

hideAll();
document.getElementById("quiz").classList.remove("hidden");

showQuestion();
}

function showQuestion(){

selected = null;

let q = questions[currentQuestion];

document.getElementById("progress").innerText =
"Soal " + (currentQuestion + 1) + " dari " + questions.length;

document.getElementById("question").innerText = q.question;

let optionHTML = "";

q.options.forEach((option,index)=>{

optionHTML +=
`<button class="option"
onclick="selectOption(${index},this)">
${String.fromCharCode(65+index)}. ${option}
</button>`;

});

document.getElementById("options").innerHTML = optionHTML;

}

function selectOption(index,element){

selected = index;

document.querySelectorAll(".option")
.forEach(x=>x.classList.remove("selected"));

element.classList.add("selected");

}

function nextQuestion(){

if(selected === null){
alert("Pilih jawaban terlebih dahulu.");
return;
}

answers.push(selected);

currentQuestion++;

if(currentQuestion < questions.length){

showQuestion();

}else{

showResult();

}

}

function showResult(){

hideAll();

document.getElementById("result").classList.remove("hidden");

let correct = 0;

answers.forEach((answer,index)=>{
if(answer === questions[index].answer){
correct++;
}
});

let percentage =
Math.round((correct/questions.length)*100);

document.getElementById("score").innerText =
percentage + "% (" + correct + "/" + questions.length + " benar)";

let reviewHTML = "";

answers.forEach((answer,index)=>{

let q = questions[index];

if(answer !== q.answer){

reviewHTML += `

<div class="review">

<h3>Soal ${index+1}</h3>

<p>${q.question}</p>

<p>
<strong>Jawabanmu:</strong>
${String.fromCharCode(65+answer)}.
${q.options[answer]}
</p>

<p>
<strong>Jawaban benar:</strong>
${String.fromCharCode(65+q.answer)}.
${q.options[q.answer]}
</p>

<p>
<strong>Pembahasan:</strong><br>
${q.explanation}
</p>

</div>

`;

}

});

if(reviewHTML === ""){
reviewHTML =
"<div class='review'><strong>Semua jawaban benar. Mantap.</strong></div>";
}

document.getElementById("review").innerHTML = reviewHTML;

}
